[package]
name = "graphite-agent-cli"
description = "The graphite-agent binary and MCP conformance tests"
version.workspace = true
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The conformance tests live in the package that declares the binary so
# `CARGO_BIN_EXE_graphite-agent` resolves (HIGH-B2).
[[bin]]
name = "graphite-agent"
path = "src/main.rs"

[dependencies]
# Local dependencies
graphite-agent-host = { path = "../host" }
graphite-agent-mcp = { path = "../mcp" }
graphite-agent-protocol = { path = "../protocol" }
graphite-agent-descriptors = { path = "../descriptors" }
graphene-cli = { path = "../../node-graph/graphene-cli" }

# Workspace dependencies
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true, features = ["derive"] }
anyhow = { workspace = true }
